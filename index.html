    <script type="text/javascript">

// Автопереход отключён: страница остаётся открытой,
// пока пользователь сам не нажмёт кнопку «Start Bot».

var tme_bg = document.getElementById('tgme_background');
if (tme_bg) {
  TWallpaper.init(tme_bg);
  TWallpaper.animate(true);
  window.onfocus = function(){ TWallpaper.update(); };
}
document.body.classList.remove('no_transition');

function toggleTheme(dark) {
  document.documentElement.classList.toggle('theme_dark', dark);
}
if (window.matchMedia) {
  var darkMedia = window.matchMedia('(prefers-color-scheme: dark)');
  toggleTheme(darkMedia.matches);
  darkMedia.addListener(function(e) {
    toggleTheme(e.matches);
  });
}

    
    </script>

    <!-- Meta Pixel: событие Lead по клику на кнопку Start Bot и на аватарку -->
    <script>
    (function () {
      ['start-bot', 'start-avatar'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', function (e) {
          // пиксель заблокирован (adblock и т.п.) → работаем как обычная ссылка
          if (typeof window.fbq !== 'function') return;
          e.preventDefault();
          fbq('track', 'Lead');
          // даём запросу уйти, прежде чем страница закроется переходом
          setTimeout(function () { window.location.href = el.href; }, 300);
        });
      });
    })();
    </script>
